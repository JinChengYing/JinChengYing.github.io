name: "JinCheng Ying's blog"
description: "应锦程的研究笔记与个人博客"
avatar: https://JinChengYing.github.io/images/%E5%BE%AE%E4%BF%A1%E5%9B%BE%E7%89%87_20241018213036.jpg
favicon: https://JinChengYing.github.io/images/R-C.jpg
url: https://JinChengYing.github.io
navigation:
  - name: 首页
    url: /
  - name: 研究图谱
    url: /agentic-rl/zh/
  - name: 分类
    url: /tags/
  - name: 关于
    url: /about/
paginate: 8
paginate_path: /page:num/
permalink: /:title/
excerpt_separator: <!-- more -->
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - PUBLISHING.md
  - scripts
